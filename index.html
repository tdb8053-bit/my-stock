  <style>

  <style>
    .pwa-auth-group{display:flex;align-items:center;gap:7px}

<body>
  <header class="top"><div class="brand"><div class="brand-title"><span class="brand-icon"><i class="fa-solid fa-chart-line"></i></span><span class="brand-copy"><span class="brand-name">智慧資產總管</span><span class="brand-meta" id="updated">登入後同步資料</span></span></div><div class="pwa-auth-group"><button class="pwa-auth" id="authButton" type="button">登入</button><span class="sync" id="sync">等待登入</span></div></div></header>
  <main>
    <section class="page active" id="page-overview">
      <article class="panel summary-hero">
        <div class="hero-heading"><span class="hero-label"><i class="fa-solid fa-wallet"></i>資產總額</span><span class="source-chip">總覽 D5</span></div>
        <div class="hero-value" id="metric-net-equity">—</div><div class="hero-capital">期初投入 <b id="metric-initial-cap">—</b></div>
        <hr class="hero-divider">
        <div class="hero-pair">
          <div class="hero-stat"><div class="hero-metrics-head"><span class="hero-stat-label">總持股市值</span></div><div class="hero-stat-value" id="metric-stock-value">—</div></div>
          <div class="hero-stat"><div class="hero-metrics-head"><span class="hero-stat-label">本期損益</span><span class="hero-stat-label" style="color:var(--cyan)">試算表</span></div><div class="hero-stat-value" id="metric-period-pnl">—</div></div>
        </div>
        <div class="hero-pair hero-subgrid">
          <div class="hero-stat"><div class="hero-stat-label">今日總損益</div><div class="hero-stat-value" id="metric-daily-pnl">—</div></div>
          <div class="hero-stat"><div class="hero-stat-label">累計已實現損益</div><div class="hero-stat-value" id="metric-realized-pnl">—</div></div>
        </div>
      </article>
      <div class="mini-metrics">
        <div class="mini-stat"><div class="mini-stat-label">元大質借金額</div><div class="mini-stat-value" id="metric-loan" style="color:#fbbf24">—</div><div class="mini-stat-note">利息精算扣抵</div></div>
        <div class="mini-stat"><div class="mini-stat-label">國泰餘額</div><div class="mini-stat-value" id="metric-cash" style="color:#34d399">—</div><div class="mini-stat-note">交割戶資料</div></div>
        <div class="mini-stat"><div class="mini-stat-label">期初投入本金</div><div class="mini-stat-value" id="metric-initial-box" style="color:#cbd5e1">—</div><div class="mini-stat-note" id="metric-total-return-pct">總回報 —</div></div>
      </div>
      <div class="data-engine"><span><i class="fa-solid fa-circle-nodes"></i> 數據引擎：新版資產總管試算表</span><button class="refresh" onclick="refreshAll()"><i class="fa-solid fa-arrows-rotate"></i> 立即更新</button></div>
      <section class="allocation-panel"><div class="section-heading"><h2 class="section-title" style="margin:0"><i class="fa-solid fa-chart-pie" style="color:#818cf8;margin-right:7px"></i>持股配置比例</h2><span class="muted" style="font-size:11px">依現價市值計算</span></div><canvas id="allocationChart" class="allocation-canvas" aria-label="持股市值配置圓餅圖"></canvas><div id="allocationLegend" class="allocation-legend"></div></section>
      <section class="trend-panel"><div class="section-heading"><div><h2 class="section-title" style="margin:0"><i class="fa-solid fa-chart-area" style="color:var(--cyan);margin-right:7px"></i>損益動態走勢</h2><div class="muted" style="font-size:10px;margin-top:3px">每日損益紀錄 · 紅漲綠跌</div></div><span class="source-chip">每日紀錄</span></div><div id="trendStats" class="trend-stats"></div><canvas class="chart" id="pnlChart" aria-label="歷史損益折線圖"></canvas><div class="chart-meta" id="historyMeta">每日紀錄以新版帳本為準。</div></section>
    </section>

    <section class="page" id="page-dividends">
      <article class="dividend-total"><div class="dividend-card-head"><span class="hero-label" style="color:#c7d2fe"><i class="fa-solid fa-hand-holding-dollar" style="color:#fbbf24;margin-right:7px"></i>在庫存股累積總配息</span><span class="source-chip" style="background:#064e3b55;color:#6ee7b7;border-color:#05966966">存股配息 O2</span></div><div class="hero-value" id="div-total-collected">—</div><div class="dividend-annual">預估年領息 <b id="div-est-annual">—</b><span id="div-est-note"></span></div></article>
      <div id="dividendCards"></div>
      <section class="month-panel"><div class="section-heading"><div><h2 class="section-title" style="margin:0"><i class="fa-solid fa-table-cells" style="color:var(--cyan);margin-right:7px"></i>月度配息明細紀錄</h2><div class="muted" id="dividendMonthCaption" style="font-size:10px;margin-top:3px">月份 A7:A · 00400A E7:E · 00406A L7:L</div></div><span class="source-chip" style="background:#083344;color:#67e8f9">自動載入</span></div><div class="scroll-x" id="monthlyDividendTable"></div></section>
    </section>
    <section class="page" id="page-watch"><div class="toolbar"><input id="watchSearch" class="field search" type="search" placeholder="搜尋股票代號" aria-label="搜尋股票代號"><button class="refresh" onclick="loadWatchlist()">↻ 更新</button></div><div class="filters" id="watchFilters"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="gainers">漲幅最大</button><button class="filter" data-filter="losers">跌幅最大</button></div><div id="watchStatus" class="watch-status">等待資料…</div><div class="panel" id="watchTable"></div></section>

  <nav class="bottom-nav" id="bottomNav"></nav>
  <dialog id="confirmDialog"><div id="confirmText"></div><div class="dialog-actions"><button class="refresh" onclick="document.getElementById('confirmDialog').close()">取消</button><button class="refresh" id="submitConfirm">確認寫入</button></div></dialog>
  <script src="./config.example.js"></script>
  <script src="./api-client.js"></script>
  <script>
    const PAGES=[['overview','總覽','⌂'],['trade','交易/庫存','⇄'],['dividends','存股配息','▤'],['watch','觀察名單','◉']];
    let active='overview',portfolio=null,watchData=null,watchFilter='all',tradeType='cash',pendingTrade=null,screenWakeLock=null,wakeLockRequest=null,resumeTimer=0,refreshPromise=null;
    const $=id=>document.getElementById(id),money=n=>n==null?'—':Number(n).toLocaleString('zh-TW',{maximumFractionDigits:2}),signed=n=>n==null?'—':(n>0?'+':'')+money(n),pct=n=>n==null?'—':(n>0?'+':'')+Number(n).toFixed(2)+'%';
    function boot(){
      $('bottomNav').innerHTML=PAGES.map(([id,label,ico])=>`<button class="${active===id?'active':''}" onclick="showPage('${id}')"><span class="ico">${ico}</span>${label}</button>`).join('');
      $('tradeDate').value=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei'}).format(new Date());
      $('tradeType').addEventListener('click',e=>{const b=e.target.closest('button[data-type]');if(!b)return;tradeType=b.dataset.type;document.querySelectorAll('#tradeType button').forEach(x=>x.classList.toggle('active',x===b));});
      $('watchSearch').addEventListener('input',renderWatchlist);
      $('watchFilters').addEventListener('click',e=>{const b=e.target.closest('button[data-filter]');if(!b)return;watchFilter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));renderWatchlist();});
      $('qty').addEventListener('input',calculateAmount);$('price').addEventListener('input',calculateAmount);
      initializePwaAuth();
      requestScreenWakeLock();
      document.addEventListener('visibilitychange',handleVisibilityChange);
      window.addEventListener('pageshow',event=>{if(event.persisted)handleForegroundResume()});
      setInterval(()=>{if(document.visibilityState==='visible'&&isPwaAuthenticated())refreshAll()},60000);
    }
    function requestScreenWakeLock(){
      if(document.visibilityState!=='visible'||!('wakeLock' in navigator))return Promise.resolve();
      if(screenWakeLock&&!screenWakeLock.released)return Promise.resolve();
      if(wakeLockRequest)return wakeLockRequest;
      try{
        wakeLockRequest=navigator.wakeLock.request('screen').then(lock=>{
          if(document.visibilityState!=='visible'){lock.release().catch(()=>{});return;}
          screenWakeLock=lock;
          lock.addEventListener('release',()=>{if(screenWakeLock===lock)screenWakeLock=null},{once:true});
        }).catch(()=>{screenWakeLock=null;}).finally(()=>{wakeLockRequest=null;});
      }catch(_){screenWakeLock=null;wakeLockRequest=null;return Promise.resolve();}
      return wakeLockRequest;
    }
    function handleVisibilityChange(){
      if(document.visibilityState!=='visible'){
        window.clearTimeout(resumeTimer);resumeTimer=0;
        if(screenWakeLock){const lock=screenWakeLock;screenWakeLock=null;lock.release().catch(()=>{});}
        return;
      }
      handleForegroundResume();
    }
    function handleForegroundResume(){
      if(document.visibilityState!=='visible')return;
      requestScreenWakeLock();
      window.clearTimeout(resumeTimer);
      resumeTimer=window.setTimeout(()=>{
        resumeTimer=0;
        if(isPwaAuthenticated())refreshAll();
      },250);
    }
    function showPage(id){active=id;document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id==='page-'+id));document.querySelectorAll('.bottom-nav button').forEach((x,i)=>x.classList.toggle('active',PAGES[i][0]===id));window.scrollTo(0,0);if(id==='watch'&&!watchData)loadWatchlist();if(id==='overview'&&portfolio){const h=(portfolio.holdings||[]).filter(x=>Number(x.shares||0)>0);renderOverview(portfolio.summary||[],h,portfolio.assetTotal);drawPnl(portfolio.pnlHistory||[])}if(id==='dividends'&&portfolio)renderDividends(portfolio.dividends||{},(portfolio.holdings||[]).filter(x=>Number(x.shares||0)>0));}
    function serverCall(name,...args){return window.apiCall(name,...args);}
    function refreshAll(){
      if(refreshPromise)return refreshPromise;
      if(!isPwaAuthenticated())return Promise.resolve();
      refreshPromise=(async()=>{
        $('sync').textContent='同步中…';
        try{
          const data=await serverCall('getPortfolioData');
          if(!isPwaAuthenticated())return;
          if(!data.ok)throw Error(data.error);
          portfolio=data;renderPortfolio();$('sync').textContent='已連線';
          $('updated').textContent='更新時間：'+new Date(data.updatedAt).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
          await loadWatchlist();
        }catch(e){
          if(e.staleAuthResponse&&isPwaAuthenticated()){
            $('sync').textContent='已重新登入 · 正在同步';
            window.setTimeout(()=>refreshAll(),0);
            return;
          }
          clearPrivateData();
          if(!isPwaAuthenticated()){
            const message='登入授權已失效或權限需確認，請按「登入」重新授權。';
            $('sync').textContent='請重新登入';showError('summary',message);return;
          }
          $('sync').textContent='同步失敗';showError('summary',e.message);
        }
      })().finally(()=>{refreshPromise=null});
      return refreshPromise;
    }
    function showError(id,message){const target=$(id);if(target){target.innerHTML=`<div class="empty">${escapeHtml(message||'資料讀取失敗')}</div>`;return}const hero=$('metric-net-equity');if(hero)hero.textContent='資料讀取失敗';const meta=$('historyMeta');if(meta)meta.textContent=message||'請稍後重新整理。'}
    function renderPortfolio(){
      renderStockOptions(portfolio.stockOptions||[]);
      const activeHoldings=(portfolio.holdings||[]).filter(h=>Number(h.shares||0)>0);
      renderOverview(portfolio.summary||[],activeHoldings,portfolio.assetTotal);
      const rows=activeHoldings.map(h=>`<tr><td>${escapeHtml(h.code)}</td><td>${money(h.price)}</td><td class="${tone(h.change)}">${signed(h.change)}</td><td class="${tone(h.changePercent)}">${pct(h.changePercent)}</td><td>${money(h.shares)}</td><td>${money(h.averageCost)}</td><td>${money(h.marketValue)}</td><td class="${tone(h.unrealizedPnl)}">${signed(h.unrealizedPnl)}</td></tr>`).join('');
      const table=`<table class="table"><thead><tr><th>代號</th><th>股價</th><th>漲跌</th><th>漲跌%</th><th>庫存</th><th>均價</th><th>市值</th><th>未實現</th></tr></thead><tbody>${rows}</tbody></table>`;
      $('holdingsTrade').innerHTML=rows?table:'<div class="empty">目前沒有庫存大於 0 的持股</div>';
      renderDividends(portfolio.dividends||{},activeHoldings);drawPnl(portfolio.pnlHistory||[]);
    }
    function valueByLabel(summary,patterns){const row=summary.find(m=>patterns.some(p=>p.test(String(m.label||''))));return row&&row.value!=null&&Number.isFinite(Number(row.value))?Number(row.value):null}
    function sumHoldingMetric(holdings,key){const values=holdings.map(h=>h[key]).filter(v=>v!=null&&Number.isFinite(Number(v)));return values.length?values.reduce((a,v)=>a+Number(v),0):null}
    function currency(n){return n==null?'—':'$'+Math.round(Number(n)).toLocaleString('zh-TW')}
    function currencySigned(n){if(n==null)return '—';const v=Math.round(Number(n));return (v>0?'+$':v<0?'-$':'$')+Math.abs(v).toLocaleString('zh-TW')}
    function setMetric(id,value,formatter=currency,colorBySign=false){const el=$(id);if(!el)return;el.textContent=formatter(value);el.classList.remove('up','down');if(colorBySign){const color=tone(value);if(color)el.classList.add(color)}}
    function renderOverview(summary,holdings,assetTotal){
      const stockValue=valueByLabel(summary,[/總持股市值/,/持股市值/,/股票市值/])??sumHoldingMetric(holdings,'marketValue');
      const netEquity=assetTotal;
      const initial=valueByLabel(summary,[/期初投入本金/,/期初投入/,/初始本金/,/期初本金/]);
      const period=valueByLabel(summary,[/本期損益/,/期間損益/]);
      const daily=valueByLabel(summary,[/今日總損益/,/今日損益/,/當日損益/])??sumHoldingMetric(holdings,'todayPnl');
      const realized=valueByLabel(summary,[/累計已實現/,/已實現損益/])??sumHoldingMetric(holdings,'realizedPnl');
      const loan=valueByLabel(summary,[/元大質借/,/質借金額/,/融資借款/]);
      const cash=valueByLabel(summary,[/國泰餘額/,/現金餘額/,/交割戶餘額/]);
      setMetric('metric-net-equity',netEquity);setMetric('metric-initial-cap',initial);
      setMetric('metric-stock-value',stockValue);setMetric('metric-period-pnl',period,currencySigned,true);
      setMetric('metric-realized-pnl',realized,currencySigned,true);setMetric('metric-loan',loan);setMetric('metric-cash',cash);setMetric('metric-initial-box',initial);
      const dailyEl=$('metric-daily-pnl'),dailyPct=stockValue>0&&daily!=null?daily/stockValue*100:null;
      if(dailyEl){dailyEl.innerHTML=daily==null?'—':`${currencySigned(daily)}${dailyPct==null?'':` <span style="font-size:10px;font-weight:600">(${daily>0?'+':''}${dailyPct.toFixed(2)}%)</span>`}`;dailyEl.classList.remove('up','down');const dailyColor=tone(daily);if(dailyColor)dailyEl.classList.add(dailyColor)}
      const returnEl=$('metric-total-return-pct');returnEl.textContent=netEquity!=null&&initial>0?`總回報 ${netEquity>=initial?'+':''}${((netEquity-initial)/initial*100).toFixed(1)}%`:'總回報 —';
      drawAllocation(holdings);
    }
    const ALLOCATION_COLORS=['#6366f1','#22d3ee','#38bdf8','#f59e0b','#34d399','#f472b6','#a78bfa','#fb7185'];
    function drawAllocation(holdings){
      const canvas=$('allocationChart'),ctx=canvas.getContext('2d'),dpr=window.devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;
      canvas.width=w*dpr;canvas.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);
      const items=holdings.map(x=>({code:x.code,value:Number(x.marketValue||0)})).filter(x=>x.value>0),total=items.reduce((s,x)=>s+x.value,0),legend=$('allocationLegend');
      if(!total){ctx.fillStyle='#9aa6b2';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('目前沒有可計算的庫存市值',w/2,h/2);legend.innerHTML='';return}
      const cx=w/2,cy=h/2,r=Math.min(w*.32,h*.43);let angle=-Math.PI/2;
      items.forEach((item,i)=>{const next=angle+item.value/total*Math.PI*2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,angle,next);ctx.closePath();ctx.fillStyle=ALLOCATION_COLORS[i%ALLOCATION_COLORS.length];ctx.fill();angle=next});
      legend.innerHTML=items.map((item,i)=>`<div class="legend-item"><span class="legend-dot" style="background:${ALLOCATION_COLORS[i%ALLOCATION_COLORS.length]}"></span><span class="legend-label">${escapeHtml(item.code)} ${Math.round(item.value/total*100)}%</span></div>`).join('');
    }
    const DIVIDEND_META={'00919':{name:'群益臺灣精選高息',frequency:'季配',field:null,multiplier:4},'00406A':{name:'主動中信台灣收益',frequency:'月配',field:'lVal',multiplier:12},'00400A':{name:'主動國泰動能高息',frequency:'月配',field:'gVal',multiplier:12}};
    function renderDividends(data,holdings=[]){
      const monthly=data?.monthlyRows||[],active=holdings.filter(h=>Number(h.shares||0)>0);
      $('div-total-collected').textContent=currency(data?.totalCollected);
      const cards=active.map(h=>{
        const meta=DIVIDEND_META[h.code]||{},payment=meta.field?monthly.find(r=>Number(r[meta.field]||0)>0):null;
        const recent=payment?Number(payment[meta.field]):null,annual=recent!=null&&meta.multiplier?recent*meta.multiplier:null;
        const recentLabel=meta.frequency==='季配'?'最近單季入息':'最近單月入息';
        return {h,meta,recent,annual,payment,recentLabel};
      });
      const estimateComplete=cards.length>0&&cards.every(x=>x.annual!=null);
      const estimate=estimateComplete?cards.reduce((s,x)=>s+x.annual,0):null;
      $('div-est-annual').textContent=estimate==null?'資料不足':currency(estimate);
      $('div-est-note').textContent=estimate==null?'（新版資料未涵蓋所有在庫標的）':'（依最近一次入息年化）';
      $('dividendCards').innerHTML=cards.length?cards.map(({h,meta,recent,annual,payment,recentLabel})=>{
        const shares=Number(h.shares||0),lots=Math.floor(shares/1000),collected=h.dividends;
        const frequency=meta.frequency||'配息資料';
        return `<article class="fund-card"><div class="dividend-card-head"><div><div class="dividend-card-head" style="justify-content:flex-start"><span class="fund-code">${escapeHtml(h.code)}</span><span class="fund-tag">${escapeHtml(frequency)}</span></div><div class="fund-name">${escapeHtml(meta.name||h.name||'')}</div><div class="fund-shares">持股數量：${money(shares)} 股（${money(lots)} 張）</div></div><div class="fund-collected"><div class="fund-collected-label">累計已領股息</div><div class="fund-collected-value">${currency(collected)}</div></div></div><div class="fund-metrics"><div class="fund-metric"><div class="fund-metric-label">${recentLabel}${payment?` · ${escapeHtml(payment.month)}`:''}</div><div class="fund-metric-value">${currency(recent)}</div></div><div class="fund-metric"><div class="fund-metric-label">${meta.frequency==='季配'?'最近單季年化':'最近單月年化'}</div><div class="fund-metric-value" style="color:${annual==null?'var(--muted)':'#34d399'}">${annual==null?'—':currency(annual)}</div></div></div></article>`;
      }).join(''):'<div class="div-empty">目前沒有庫存大於 0 的配息標的；累計總配息仍保留於上方。</div>';
      const supported=active.filter(h=>h.code==='00400A'||h.code==='00406A');
      $('dividendMonthCaption').textContent=supported.length?supported.map(h=>h.code).join(' 與 ')+' 現金流歷程':'月度明細僅列出目前有庫存的標的';
      const fields=supported.map(h=>({code:h.code,key:h.code==='00400A'?'gVal':'lVal'}));
      if(!fields.length||!monthly.length){$('monthlyDividendTable').innerHTML='<div class="div-empty">沒有可顯示的在庫月度配息資料</div>';return}
      const totals=Object.fromEntries(fields.map(f=>[f.code,0]));let grand=0;
      const body=monthly.map(row=>{let subtotal=0;const cells=fields.map(f=>{const v=row[f.key]==null?null:Number(row[f.key]);if(v!=null&&Number.isFinite(v)){totals[f.code]+=v;subtotal+=v}const color=v>0?(f.code==='00400A'?'ticker-g':'ticker-l'):'muted';return `<td class="${color}">${v>0?currency(v):'—'}</td>`}).join('');grand+=subtotal;return `<tr><td class="month-name">${escapeHtml(row.month)}</td>${cells}<td class="${subtotal>0?'total-cell':'muted'}">${subtotal>0?currency(subtotal):'—'}</td></tr>`}).join('');
      const headers=fields.map(f=>`<th class="${f.code==='00400A'?'ticker-g':'ticker-l'}">${escapeHtml(f.code)}</th>`).join(''),foot=fields.map(f=>`<td>${currency(totals[f.code])}</td>`).join('');
      const columnWidths=fields.length===2?['24%','22%','22%','32%']:['25%','45%','30%'];
      const columnGroup=`<colgroup>${columnWidths.map(width=>`<col style="width:${width}">`).join('')}</colgroup>`;
      const totalRow=`<tr class="total-row"><td class="month-name">合計領息</td>${foot}<td class="total-cell">${currency(grand)}</td></tr>`;
      $('monthlyDividendTable').innerHTML=`<table class="table month-table">${columnGroup}<thead><tr><th>入息月份</th>${headers}<th>當月小計</th></tr></thead><tbody>${totalRow}${body}</tbody></table>`;
    }
    function drawPnl(points){const c=$('pnlChart'),ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);const vals=points.map(x=>Number(x.pnl)).filter(Number.isFinite);if(!vals.length){ctx.fillStyle='#9aa6b2';ctx.font='14px sans-serif';ctx.fillText('尚無每日損益紀錄',12,h/2);$('historyMeta').textContent='新版帳本出現第一筆有效每日快照後，走勢會從該日開始累積。';$('trendStats').innerHTML='';return}const min=Math.min(0,...vals),max=Math.max(0,...vals),pad=18,span=max-min||1,y=v=>h-pad-(v-min)/span*(h-pad*2),zero=y(0);ctx.strokeStyle='#f87171';ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(pad,zero);ctx.lineTo(w-pad,zero);ctx.stroke();ctx.setLineDash([]);ctx.beginPath();vals.forEach((v,i)=>{const x=pad+i*(w-2*pad)/Math.max(1,vals.length-1);i?ctx.lineTo(x,y(v)):ctx.moveTo(x,y(v))});ctx.strokeStyle='#22d3ee';ctx.lineWidth=2;ctx.stroke();vals.forEach((v,i)=>{const x=pad+i*(w-2*pad)/Math.max(1,vals.length-1);ctx.fillStyle=v>=0?'#f87171':'#4ade80';ctx.beginPath();ctx.arc(x,y(v),3,0,Math.PI*2);ctx.fill()});const stats=[['波段最高點',Math.max(...vals)],['波段最低點',Math.min(...vals)],['目前損益',vals[vals.length-1]]];$('trendStats').innerHTML=stats.map(([label,value])=>`<div class="trend-stat"><span class="trend-stat-label">${label}</span><span class="trend-stat-value ${tone(value)}">${currencySigned(value)}</span></div>`).join('');$('historyMeta').textContent=`${points.length} 筆紀錄，${points[0].date} 起；資料來自新版帳本。`}
    async function loadWatchlist(){if(!isPwaAuthenticated())return;try{const d=await serverCall('getWatchlistData');if(!isPwaAuthenticated())return;watchData=d;const info=`${d.source||'市場資料'} · ${d.asOf||'日期未知'} 收盤${d.delayed?' · 盤後資料':''}`;$('watchStatus').textContent=d.error?`${info} · ${d.error}`:`${info} · ${d.note||''}`;renderWatchlist()}catch(e){$('watchStatus').textContent='報價讀取失敗：'+e.message;watchData={items:[]};renderWatchlist()}}
    function renderWatchlist(){
      const q=$('watchSearch').value.trim().toUpperCase();
      const items=(watchData?.items||[]).filter(x=>x.historicalClose!=null&&x.latestPrice!=null&&x.changePercent!=null&&(!q||x.code.includes(q)));
      const byChange=(a,b,direction)=>{if(a.changePercent==null)return b.changePercent==null?0:1;if(b.changePercent==null)return -1;return direction*(a.changePercent-b.changePercent)};
      if(watchFilter==='gainers')items.sort((a,b)=>byChange(a,b,-1));
      if(watchFilter==='losers')items.sort((a,b)=>byChange(a,b,1));
      const index=watchData?.index;
      const historicalDate=(watchData?.historicalDate||'2026-07-30').slice(5).replace('-','/');
      const indexReady=index?.historicalClose!=null&&index?.latestPrice!=null&&index?.changePercent!=null;
      let body=`<tr class="index-row"><td>加權股價指數</td><td>${money(index?.historicalClose)}</td><td>${money(index?.latestPrice)}</td><td class="${tone(index?.changePercent)}">${pct(index?.changePercent)}</td><td>基準</td></tr>`;
      body+=items.map(x=>{const relative=indexReady?x.changePercent-index.changePercent:null;return `<tr><td>${escapeHtml(x.code)}</td><td>${money(x.historicalClose)}</td><td>${money(x.latestPrice)}</td><td class="${tone(x.changePercent)}">${pct(x.changePercent)}</td><td class="${tone(relative)}">${relative==null?'—':(relative>0?'+':'')+relative.toFixed(2)+' 個百分點'}</td></tr>`}).join('');
      if(!items.length)body+='<tr><td colspan="5" class="muted">沒有符合的股票代號</td></tr>';
      $('watchTable').innerHTML=`<div class="watch-results"><table class="table watch-table"><thead><tr><th>代號</th><th>${historicalDate} 收盤</th><th>最新收盤</th><th>漲跌幅</th><th>較加權</th></tr></thead><tbody>${body}</tbody></table></div>`
    }
    function renderStockOptions(codes){const select=$('tradeCode'),selected=select.value;select.innerHTML='<option value="">選擇股票代號</option>'+codes.map(code=>`<option value="${escapeHtml(code)}">${escapeHtml(code)}</option>`).join('')+'<option value="__custom__">輸入其他代號…</option>';if(codes.includes(selected)||selected==='__custom__')select.value=selected}
    function toggleCustomCode(force){if(force===false)$('tradeCode').value='';const custom=force===true||$('tradeCode').value==='__custom__';$('tradeCode').style.display=custom?'none':'block';$('tradeCodeCustom').style.display=custom?'block':'none';$('stockPickerBack').style.display=custom?'block':'none';if(custom)$('tradeCodeCustom').focus()}
    function selectedTradeCode(){return $('tradeCode').value==='__custom__'?$('tradeCodeCustom').value.trim().toUpperCase():$('tradeCode').value.trim().toUpperCase()}
    function stepQty(n){$('qty').value=Math.max(1,Number($('qty').value||0)+n);calculateAmount()}function calculateAmount(){const q=Number($('qty').value),p=Number($('price').value);if(q>0&&p>0)$('amount').value=Math.round(q*p)}
    function confirmTrade(side){if(!isPwaAuthenticated()){alert('請先登入 Google 帳戶再登記交易。');return}const p={code:selectedTradeCode(),date:$('tradeDate').value,type:tradeType,side,quantity:Number($('qty').value),price:Number($('price').value),amount:Number($('amount').value),financing:Number($('finance').value||0),repayment:Number($('repayment').value||0)};if(!p.code||!p.date||!(p.quantity>0)||!(p.price>0)||!(p.amount>0)){alert('請填妥代號、日期、股數、成交價與金額。');return}if(p.type==='margin'&&side==='buy'&&!(p.financing>0)){alert('融資買進請填融資金額。');return}pendingTrade=p;$('confirmText').innerHTML=`<h3>確認${side==='buy'?'買進':'賣出'}紀錄</h3><p>${escapeHtml(p.code)} · ${p.date}</p><p>${p.type==='margin'?'融資':'現股'} · ${money(p.quantity)} 股 · 成交價 ${money(p.price)}</p><p>金額 ${money(p.amount)} 元</p><p class="warning">確認後會新增至新版試算表，不會送出券商委託。</p>`;$('confirmDialog').showModal();}
    $('submitConfirm').addEventListener('click',async e=>{
      if(!pendingTrade)return;
      const button=e.currentTarget;button.disabled=true;button.textContent='寫入中…';
      let req=sessionStorage.getItem('pendingTransactionRequestId');
      if(!req){req=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));sessionStorage.setItem('pendingTransactionRequestId',req)}
      try{
        const status=await serverCall('getSubmissionStatus',req);
        if(status.status==='written'){sessionStorage.removeItem('pendingTransactionRequestId');$('confirmDialog').close();alert('這筆交易已寫入，不會重複新增。');await refreshAll();return}
        if(status.status==='pending'||status.status==='uncertain'){alert('前一筆送出的結果仍待核對，請先查看新版交易記錄，不要重送。');return}
        const result=await serverCall('submitTransaction',pendingTrade,req);
        sessionStorage.removeItem('pendingTransactionRequestId');$('confirmDialog').close();alert(result.message);await refreshAll();
      }catch(err){
        try{const status=await serverCall('getSubmissionStatus',req);if(status.status==='written'){sessionStorage.removeItem('pendingTransactionRequestId');$('confirmDialog').close();alert('交易已寫入新版試算表。');await refreshAll()}else{alert(err.message+' 請先查看新版交易記錄；為避免重複，系統保留本次送出識別碼。')}}
        catch(_){alert(err.message+' 請先查看新版交易記錄；為避免重複，系統保留本次送出識別碼。')}
      }finally{button.disabled=false;button.textContent='確認寫入';if(!sessionStorage.getItem('pendingTransactionRequestId'))pendingTrade=null}
    });
    function clearPrivateData(){
      portfolio=null;watchData=null;
      document.querySelectorAll('.hero-value,.hero-stat-value,.mini-stat-value,.fund-metric-value,.fund-collected-value').forEach(el=>el.textContent='—');
      ['metric-total-return-pct','div-est-annual','div-est-note'].forEach(id=>{const el=$(id);if(el)el.textContent='—'});
      ['tradeCode','tradeCodeCustom','price','amount','finance','repayment'].forEach(id=>{const el=$(id);if(el)el.value=''});
      pendingTrade=null;if($('confirmDialog').open)$('confirmDialog').close();$('confirmText').textContent='';
      ['dividendCards','holdingsTrade','monthlyDividendTable','watchTable','trendStats','allocationLegend'].forEach(id=>{const el=$(id);if(el)el.innerHTML=''});
      $('updated').textContent='登入後同步資料';$('watchStatus').textContent='登入後查看觀察名單';$('historyMeta').textContent='登入後查看每日損益紀錄。';
      ['pnlChart','allocationChart'].forEach(id=>{const canvas=$(id);if(canvas){const context=canvas.getContext('2d');if(context)context.clearRect(0,0,canvas.width,canvas.height)}});
    }
    window.clearPrivateData=clearPrivateData;
    function tone(n){return n==null?'':Number(n)>0?'up':Number(n)<0?'down':''}function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
    boot();
  </script>
</body>
